syntax = "proto3";

package assay.v1;

option go_package = "github.com/bcypher01/assay/gen/go/assay/v1;assayv1";

message Empty {}
message Instrument {
  string symbol = 1;
  string quality_tier = 2;
  repeated string timeframes = 3;
}
message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
}
message EnsureDataRequest {
  string symbol = 1;
  string timeframe = 2;
  sint64 from_ms = 3;
  sint64 to_ms = 4;
}
enum ProgressStage {
  PROGRESS_STAGE_UNSPECIFIED = 0;
  PROGRESS_STAGE_CHECKING_LOCAL_DATA = 1;
  PROGRESS_STAGE_DOWNLOADING = 2;
  PROGRESS_STAGE_VERIFYING = 3;
  PROGRESS_STAGE_SAVING_LOCALLY = 4;
  PROGRESS_STAGE_READY = 5;
  PROGRESS_STAGE_LOADING_CACHE = 6;
  PROGRESS_STAGE_EVALUATING_STRATEGY = 7;
  PROGRESS_STAGE_SIMULATING = 8;
  PROGRESS_STAGE_CALCULATING_METRICS = 9;
  PROGRESS_STAGE_SAVING_HISTORY = 10;
}
message Progress {
  uint32 percent = 1;
  string stage = 2;
  sint64 bytes_done = 3;
  sint64 bytes_total = 4;
  string current_file = 5;
  ProgressStage stage_code = 6;
}
enum DataReadiness {
  DATA_READINESS_UNSPECIFIED = 0;
  DATA_READINESS_READY = 1;
  DATA_READINESS_PARTIAL = 2;
  DATA_READINESS_MISSING = 3;
  DATA_READINESS_SOURCE_UNAVAILABLE = 4;
  DATA_READINESS_CORRUPT = 5;
  DATA_READINESS_UNSUPPORTED = 6;
}
message DataPartition {
  string symbol = 1;
  string timeframe = 2;
  string month = 3;
  sint64 from_ms = 4;
  sint64 to_ms = 5;
}
message DataStatusResponse {
  DataReadiness readiness = 1;
  sint64 requested_from_ms = 2;
  sint64 requested_to_ms = 3;
  sint64 cached_from_ms = 4;
  sint64 cached_to_ms = 5;
  repeated DataPartition missing_partitions = 6;
  string snapshot = 7;
  repeated string sources = 8;
  sint64 last_successful_preparation_ms = 9;
  bool external_access_required = 10;
  string error_code = 11;
  string error = 12;
}
service DataService {
  rpc ListInstruments(Empty) returns (ListInstrumentsResponse);
  rpc DataStatus(EnsureDataRequest) returns (DataStatusResponse);
  rpc EnsureData(EnsureDataRequest) returns (stream Progress);
}

message EventFilter {
  sint64 from_ms = 1;
  sint64 to_ms = 2;
  sint64 as_of_ms = 3;
  repeated string kinds = 4;
  repeated string currencies = 5;
  string minimum_impact = 6;
}
message EventRecord {
  string id = 1;
  sint64 occurred_at_ms = 2;
  sint64 knowledge_at_ms = 3;
  string precision = 4;
  string kind = 5;
  string title = 6;
  string jurisdiction = 7;
  repeated string currencies = 8;
  string impact = 9;
  string status = 10;
  string source = 11;
  string actual = 12;
  string forecast = 13;
  string previous = 14;
  string revision_of = 15;
}
message QueryEventsRequest { string snapshot = 1; EventFilter filter = 2; }
message QueryEventsResponse { string snapshot = 1; repeated EventRecord events = 2; }
message EventTradeConfig {
  string entry_timing = 1;
  string direction_rule = 2;
  string entry_delay = 3;
  string hold_for = 4;
  double minimum_surprise_z = 5;
  string surprise_filter = 6;
  sint64 starting_equity = 7;
  sint64 position_size = 8;
  sint64 cost_per_trade = 9;
  double stop_loss = 10;
  double take_profit = 11;
}
message EventStudyRequest {
  string snapshot = 1;
  string symbol = 2;
  string timeframe = 3;
  EventFilter filter = 4;
  repeated string windows = 5;
  EventTradeConfig trade = 6;
}
message EventObservation {
  string event_id = 1;
  sint64 occurred_at_ms = 2;
  sint64 aligned_bar_ms = 3;
  map<string, double> returns = 4;
  string actual = 5;
  string forecast = 6;
  string previous = 7;
  double surprise = 8;
  double surprise_z = 9;
  bool has_surprise = 10;
}
message EventExclusion { string event_id = 1; string reason = 2; }
message EventWindowSummary {
  string window = 1;
  uint32 count = 2;
  double mean = 3;
  double median = 4;
  double mean_abs = 5;
  double median_abs = 6;
  uint32 up_count = 7;
  uint32 down_count = 8;
  double baseline_mean_abs = 9;
  double impact_ratio = 10;
}
message EventTrade {
  string event_id = 1;
  sint64 event_time_ms = 2;
  sint64 entry_time_ms = 3;
  sint64 exit_time_ms = 4;
  string side = 5;
  double market_return = 6;
  double strategy_return = 7;
  sint64 gross_pnl = 8;
  sint64 costs = 9;
  sint64 net_pnl = 10;
  double mfe = 11;
  double mae = 12;
  double surprise = 13;
  double surprise_z = 14;
  bool has_surprise = 15;
  string exit_reason = 16;
  bool ambiguous = 17;
  bool whipsaw = 18;
}
message EventTradeSummary {
  uint32 trades = 1;
  uint32 wins = 2;
  uint32 losses = 3;
  uint32 whipsaws = 4;
  uint32 ambiguous = 5;
  sint64 gross_pnl = 6;
  sint64 costs = 7;
  sint64 net_pnl = 8;
  sint64 ending_equity = 9;
  sint64 max_drawdown = 10;
  double expectancy = 11;
  double profit_factor = 12;
  double average_mfe = 13;
  double average_mae = 14;
}
message EventStudyResponse {
  string event_snapshot = 1;
  string bar_snapshot = 2;
  string methodology_version = 3;
  repeated EventObservation eligible_events = 4;
  repeated EventExclusion excluded_events = 5;
  repeated EventWindowSummary windows = 6;
  EventTradeSummary trade_summary = 7;
  repeated EventTrade trades = 8;
}
service EventStudyService {
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsResponse);
  rpc RunEventStudy(EventStudyRequest) returns (EventStudyResponse);
}

message PrimitiveInfo {
  string pack = 1;
  string type = 2;
  string output_kind = 3;
  string parameter_schema = 4;
  bool timeframed = 5;
}
message ListPrimitivesResponse {
  repeated PrimitiveInfo primitives = 1;
}
message EvaluatePrimitiveRequest {
  string pack = 1;
  string type = 2;
  bytes params_json = 3;
  string snapshot = 4;
}
message EvaluatePrimitiveResponse {
  string error = 1;
}
service PrimitiveService {
  rpc ListPrimitives(Empty) returns (ListPrimitivesResponse);
  rpc Evaluate(EvaluatePrimitiveRequest) returns (EvaluatePrimitiveResponse);
}

message ValidateRequest {
  bytes strategy_json = 1;
}
message FieldError {
  string path = 1;
  string message = 2;
}
message ValidateResponse {
  repeated FieldError errors = 1;
  string hash = 2;
}
message StrategyRule {
  string branch = 1;
  string text = 2;
  bool enabled = 3;
}
message StrategyDescription {
  string summary = 1;
  repeated StrategyRule rules = 2;
}
message DescribeStrategyRequest {
  bytes strategy_json = 1;
}
message DescribeStrategyResponse {
  StrategyDescription description = 1;
}
message RunRequest {
  bytes strategy_json = 1;
  string snapshot = 2;
  sint64 from_ms = 3;
  sint64 to_ms = 4;
  StudyAssumptions assumptions = 5;
}

// StudyAssumptions are the user-visible execution choices for one run.
// initial_equity, EquityChunk, net_pnl, commission_flat, and persisted result
// money values are integer USD cents: 1,000,000 means $10,000. Price and
// spread/slippage fields remain instrument ticks.
message StudyAssumptions {
  sint64 initial_equity = 1;
  double risk_per_trade = 2;
  double fixed_lots = 3;
  sint64 spread_ticks = 4;
  double commission_bps = 5;
  sint64 commission_flat = 6;
  sint64 slippage_ticks = 7;
  string fill_policy = 8;
}
message EquityChunk {
  repeated sint64 values = 1;
}
message TradeChunk {
  uint32 count = 1;
}
message RunSummary {
  uint32 trades = 1;
  uint32 unresolved = 2;
  string error = 3;
  string run_id = 4;
  uint32 wins = 5;
  uint32 losses = 6;
  uint32 long_trades = 7;
  uint32 short_trades = 8;
  sint64 net_pnl = 9;
  double expectancy = 10;
  double profit_factor = 11;
  string error_code = 12;
  // Entry signals whose resting order the next bar never reached. A limit or
  // stop study trades less often than it signals, and hiding that would make
  // the run look like it found fewer setups than it did.
  uint32 unfilled = 13;
}
message RunUpdate {
  oneof payload {
    Progress progress = 1;
    EquityChunk equity = 2;
    TradeChunk trades = 3;
    RunSummary summary = 4;
  }
}
service StudyService {
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Describe(DescribeStrategyRequest) returns (DescribeStrategyResponse);
  rpc Run(RunRequest) returns (stream RunUpdate);
}

message StrategyTemplate {
  string id = 1;
  uint32 version = 2;
  string name = 3;
  string family = 4;
  string description = 5;
  string expected_frequency = 6;
  bytes strategy_json = 7;
  StrategyDescription strategy_description = 8;
}
message ListTemplatesResponse {
  repeated StrategyTemplate templates = 1;
}
service TemplateService {
  rpc ListTemplates(Empty) returns (ListTemplatesResponse);
}

message ListRunsResponse {
  repeated string hashes = 1;
}
message GetRunRequest {
  string hash = 1;
}
message BoundedMetric {
  double pessimistic = 1;
  double optimistic = 2;
}
message ResultMetrics {
  BoundedMetric final_equity = 1;
  BoundedMetric max_drawdown = 2;
  BoundedMetric average_drawdown = 3;
  BoundedMetric profit_factor = 4;
  BoundedMetric expectancy = 5;
  uint32 trades = 6;
  uint32 wins = 7;
  uint32 losses = 8;
  uint32 longest_losing_streak = 9;
}
message RunDetails {
  string run_id = 1;
  string strategy_hash = 2;
  string snapshot = 3;
  string name = 4;
  string period = 5;
  repeated string instruments = 6;
  ResultMetrics out_of_sample = 7;
  ResultMetrics in_sample = 8;
  uint32 trials = 9;
  bool trade_list_present = 10;
  StudyAssumptions assumptions = 11;
  uint32 unresolved = 12;
  repeated PeriodMetrics yearly = 13;
  repeated PeriodMetrics monthly = 14;
  repeated NearMissSummary near_misses = 15;
  repeated WalkForwardWindow walk_forward = 16;
  repeated CostStressPoint cost_stress = 17;
  MonteCarloSummary monte_carlo = 18;
  SensitivityGrid sensitivity = 19;
  repeated NextAction next_actions = 20;
  uint32 unfilled = 21;
}
message PeriodMetrics {
  string period = 1;
  BoundedMetric net_pnl = 2;
  uint32 trades = 3;
  uint32 wins = 4;
  uint32 losses = 5;
}
message NearMissSummary {
  string condition = 1;
  uint32 count = 2;
}
message GetRunDetailsResponse {
  RunDetails details = 1;
}
message GetRunTradesRequest {
  string hash = 1;
  uint32 page_size = 2;
  uint32 page_offset = 3;
}
message TradeRecord {
  string side = 1;
  sint64 entry_time_ms = 2;
  sint64 exit_time_ms_pessimistic = 3;
  sint64 exit_time_ms_optimistic = 4;
  sint64 entry_price = 5;
  sint64 exit_price_pessimistic = 6;
  sint64 exit_price_optimistic = 7;
  sint64 stop = 8;
  sint64 target = 9;
  sint64 lots = 10;
  BoundedMetric net_pnl = 11;
  BoundedMetric costs = 12;
  bool ambiguous = 13;
}
message GetRunTradesResponse {
  repeated TradeRecord trades = 1;
  uint32 total = 2;
  uint32 next_offset = 3;
}
message WalkForwardWindow {
  uint32 train_from = 1;
  uint32 train_to = 2;
  uint32 test_from = 3;
  uint32 test_to = 4;
  ResultMetrics out_of_sample = 5;
}
message CostStressPoint {
  uint32 multiplier = 1;
  ResultMetrics metrics = 2;
}
message Percentile {
  double p05 = 1;
  double p50 = 2;
  double p95 = 3;
}
message MonteCarloSummary {
  Percentile final_equity = 1;
  Percentile max_drawdown = 2;
  double realised_final_equity = 3;
  double realised_max_drawdown = 4;
  uint32 samples = 5;
  uint32 block_length = 6;
  uint64 seed = 7;
}
message SensitivityCell {
  ResultMetrics metrics = 1;
}
message SensitivityGrid {
  repeated string x = 1;
  repeated string y = 2;
  repeated SensitivityCell cells = 3;
}
message NextAction {
  string kind = 1;
  string reason = 2;
}
message CompareRunsRequest {
  string left = 1;
  string right = 2;
}
message ParamChange {
  string path = 1;
  string from = 2;
  string to = 3;
}
message MetricDelta {
  string name = 1;
  double pessimistic = 2;
  double optimistic = 3;
}
message CompareRunsResponse {
  string error = 1;
  repeated ParamChange changes = 2;
  repeated MetricDelta metric_deltas = 3;
}
service RunService {
  rpc ListRuns(Empty) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (RunSummary);
  rpc GetDetails(GetRunRequest) returns (GetRunDetailsResponse);
  rpc GetTrades(GetRunTradesRequest) returns (GetRunTradesResponse);
  rpc Compare(CompareRunsRequest) returns (CompareRunsResponse);
}
