<title>The Assay Run Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
/>

<style>
  :root {
    --ground: #dce0e2;
    --paper: #edefef;
    --raise: #f6f7f7;
    --sunk: #d2d7d9;
    --rule: #b6bec1;
    --rule-soft: #c9d0d2;
    --text: #101a1f;
    --text-2: #47555b;
    --text-3: #748288;
    --blue: #14607f;
    --blue-2: #0e4a62;
    --blue-wash: #14607f14;
    --pass: #2b6b4f;
    --caution: #8a6510;
    --fail: #9c3324;
    --oxblood: #7e2b37;
    --grid: #101a1f0d;
    --shade: #101a1f08;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #0b1114;
      --paper: #10171a;
      --raise: #161f23;
      --sunk: #0a0f12;
      --rule: #27343a;
      --rule-soft: #1c272b;
      --text: #e4eaec;
      --text-2: #97a6ac;
      --text-3: #6b7a80;
      --blue: #5cb6da;
      --blue-2: #8ad0ec;
      --blue-wash: #5cb6da1a;
      --pass: #5fa97e;
      --caution: #c79b37;
      --fail: #de7461;
      --oxblood: #c97281;
      --grid: #e4eaec0a;
      --shade: #e4eaec08;
    }
  }
  :root[data-theme='dark'] {
    --ground: #0b1114;
    --paper: #10171a;
    --raise: #161f23;
    --sunk: #0a0f12;
    --rule: #27343a;
    --rule-soft: #1c272b;
    --text: #e4eaec;
    --text-2: #97a6ac;
    --text-3: #6b7a80;
    --blue: #5cb6da;
    --blue-2: #8ad0ec;
    --blue-wash: #5cb6da1a;
    --pass: #5fa97e;
    --caution: #c79b37;
    --fail: #de7461;
    --oxblood: #c97281;
    --grid: #e4eaec0a;
    --shade: #e4eaec08;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .mono,
  .stamp,
  .n {
    font-family: 'Spline Sans Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  .lbl {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  h1,
  h2,
  h3 {
    font-family: 'Syne', sans-serif;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  button {
    font-family: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  /* ================= shell ================= */

  .app {
    display: grid;
    grid-template-columns: 276px minmax(0, 1fr);
    min-height: 100vh;
  }
  @media (max-width: 900px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  /* ---------- spine ---------- */

  .spine {
    background: var(--sunk);
    border-right: 1px solid var(--rule);
    padding: 22px 0 40px;
    position: sticky;
    top: 0;
    align-self: start;
    max-height: 100vh;
    overflow-y: auto;
  }
  @media (max-width: 900px) {
    .spine {
      position: static;
      max-height: none;
    }
  }

  .spine-head {
    padding: 0 20px 18px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    display: block;
  }
  .wordmark span {
    color: var(--blue);
  }
  .spine-head .lbl {
    display: block;
    margin-top: 3px;
  }

  .log {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .log li {
    position: relative;
  }
  .entry {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--rule-soft);
    padding: 12px 20px 12px 52px;
    cursor: default;
    color: var(--text-3);
    display: block;
  }
  .entry .t {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 10px;
    color: var(--text-3);
    display: block;
  }
  .entry .h {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-3);
    display: block;
    margin-top: 1px;
    font-family: 'Instrument Sans', sans-serif;
  }
  .entry .s {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    display: block;
    margin-top: 3px;
    opacity: 0.85;
    line-height: 1.45;
  }
  .entry::before {
    content: '';
    position: absolute;
    left: 25px;
    top: 17px;
    width: 9px;
    height: 9px;
    border: 1px solid var(--rule);
    background: var(--sunk);
    z-index: 2;
  }
  .log li::after {
    content: '';
    position: absolute;
    left: 29px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--rule-soft);
  }
  .log li:first-child::after {
    top: 17px;
  }
  .log li:last-child::after {
    display: none;
  }

  .entry.done {
    cursor: pointer;
  }
  .entry.done .h,
  .entry.done .t {
    color: var(--text-2);
  }
  .entry.done::before {
    background: var(--blue);
    border-color: var(--blue);
  }
  .entry.done:hover {
    background: var(--shade);
  }
  .entry.done:hover .h {
    color: var(--text);
  }

  .entry.here {
    background: var(--paper);
  }
  .entry.here .h {
    color: var(--text);
    font-weight: 600;
  }
  .entry.here::before {
    background: var(--paper);
    border-color: var(--text);
    box-shadow:
      0 0 0 3px var(--paper),
      0 0 0 4px var(--rule);
  }
  .entry.branch::before {
    transform: rotate(45deg);
  }

  .trialbox {
    margin: 20px 20px 0;
    border: 1px solid var(--rule);
    padding: 12px 13px;
    background: var(--paper);
  }
  .trialbox .lbl {
    display: block;
  }
  .trialbox .big {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 26px;
    color: var(--oxblood);
    display: block;
    margin-top: 4px;
    line-height: 1;
  }
  .trialbox p {
    margin: 8px 0 0;
    font-size: 11.5px;
    color: var(--text-3);
    line-height: 1.45;
  }

  /* ---------- main ---------- */

  .main {
    background: var(--paper);
    min-width: 0;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 14px 40px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 8;
  }
  .crumb {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .crumb b {
    color: var(--text-2);
    font-weight: 500;
  }
  .topbar .spacer {
    flex: 1;
  }

  .ghost {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--text-2);
    font-family: 'Spline Sans Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 10px;
    cursor: pointer;
  }
  .ghost:hover {
    border-color: var(--text-3);
    color: var(--text);
  }

  .stage {
    padding: 44px 40px 90px;
    max-width: 900px;
  }
  @media (max-width: 640px) {
    .stage,
    .topbar {
      padding-left: 20px;
      padding-right: 20px;
    }
  }

  .step-eyebrow {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .step-eyebrow .lbl {
    color: var(--blue);
  }
  h1.step {
    font-size: clamp(27px, 4vw, 39px);
    font-weight: 700;
    line-height: 1.02;
    margin-top: 8px;
  }
  .step-sub {
    color: var(--text-2);
    max-width: 60ch;
    margin: 12px 0 0;
    font-size: 16.5px;
  }

  .actions {
    margin-top: 38px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .primary {
    background: var(--blue);
    color: var(--paper);
    border: 1px solid var(--blue);
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .primary:hover {
    background: var(--blue-2);
    border-color: var(--blue-2);
  }
  .primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .back {
    background: transparent;
    border: 0;
    color: var(--text-3);
    cursor: pointer;
    font-size: 13.5px;
    padding: 10px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .back:hover {
    color: var(--text);
  }
  .hint {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 11.5px;
    color: var(--text-3);
  }

  /* ---------- generic pieces ---------- */

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
    gap: 0;
    margin-top: 30px;
    border-top: 1px solid var(--rule);
    border-left: 1px solid var(--rule);
  }
  .card {
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    padding: 18px 18px 16px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 190px;
  }
  .card:hover {
    background: var(--raise);
  }
  .card.sel {
    background: var(--raise);
    box-shadow: inset 3px 0 0 var(--blue);
  }
  .card h3 {
    font-size: 16.5px;
    font-weight: 600;
    font-family: 'Instrument Sans', sans-serif;
    letter-spacing: 0;
  }
  .card p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-2);
    line-height: 1.5;
  }
  .card .meta {
    margin-top: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid var(--rule);
    padding: 2px 6px;
    color: var(--text-3);
  }
  .pill.freq-high {
    color: var(--caution);
    border-color: var(--caution);
  }
  .pill.freq-low {
    color: var(--text-3);
  }
  .spark {
    height: 34px;
    width: 100%;
    display: block;
  }

  .fields {
    margin-top: 30px;
    border-top: 1px solid var(--rule);
  }
  .field {
    display: grid;
    grid-template-columns: 178px minmax(0, 1fr) 132px;
    gap: 20px;
    padding: 15px 0;
    border-bottom: 1px solid var(--rule-soft);
    align-items: baseline;
  }
  @media (max-width: 720px) {
    .field {
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
    }
  }
  .field > .lbl {
    padding-top: 3px;
  }
  .field .ctl {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: baseline;
  }
  .field .tail {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 11.5px;
    color: var(--text-3);
    text-align: right;
  }
  @media (max-width: 720px) {
    .field .tail {
      text-align: left;
    }
  }
  .field .tail.warnt {
    color: var(--caution);
  }

  .seg {
    display: inline-flex;
    border: 1px solid var(--rule);
  }
  .seg button {
    background: transparent;
    border: 0;
    border-right: 1px solid var(--rule);
    padding: 6px 11px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    font-family: 'Instrument Sans', sans-serif;
  }
  .seg button:last-child {
    border-right: 0;
  }
  .seg button:hover {
    background: var(--shade);
    color: var(--text);
  }
  .seg button[aria-pressed='true'] {
    background: var(--blue);
    color: var(--paper);
  }

  .num-in {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 13.5px;
    background: var(--raise);
    color: var(--text);
    border: 1px solid var(--rule);
    padding: 6px 8px;
    width: 84px;
  }

  .summary {
    margin-top: 28px;
    border: 1px solid var(--rule);
    background: var(--raise);
    padding: 20px 22px;
  }
  .summary .lbl {
    display: block;
    margin-bottom: 8px;
  }
  .summary p {
    margin: 0;
    font-size: 17px;
    line-height: 1.65;
    color: var(--text-2);
  }
  .summary b {
    color: var(--text);
    font-weight: 600;
  }

  .flag {
    margin-top: 16px;
    border-left: 3px solid var(--caution);
    background: var(--shade);
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text-2);
  }
  .flag b {
    color: var(--caution);
  }
  .flag.bad {
    border-left-color: var(--fail);
  }
  .flag.bad b {
    color: var(--fail);
  }

  /* ---------- run ---------- */

  .runbox {
    margin-top: 34px;
    border: 1px solid var(--rule);
    background: var(--raise);
  }
  .runline {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 13px 18px;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 14.5px;
    color: var(--text-3);
  }
  .runline:last-child {
    border-bottom: 0;
  }
  .runline .mark {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 12px;
  }
  .runline .ms {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 11.5px;
  }
  .runline.on {
    color: var(--text);
  }
  .runline.on .mark {
    color: var(--blue);
  }
  .runline.ok {
    color: var(--text-2);
  }
  .runline.ok .mark {
    color: var(--pass);
  }
  .progress {
    height: 3px;
    background: var(--sunk);
    margin-top: 0;
  }
  .progress i {
    display: block;
    height: 100%;
    background: var(--blue);
    width: 0;
    transition: width 0.4s linear;
  }

  /* ---------- result ---------- */

  .verdict {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 176px;
    gap: 30px;
    align-items: start;
    margin-top: 26px;
  }
  @media (max-width: 760px) {
    .verdict {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .vword {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 5.4vw, 52px);
    line-height: 0.98;
    letter-spacing: -0.025em;
    text-transform: uppercase;
  }
  .vword.pass {
    color: var(--pass);
  }
  .vword.warn {
    color: var(--caution);
  }
  .vword.bad {
    color: var(--fail);
  }
  .vbody {
    font-size: 18px;
    color: var(--text-2);
    margin: 14px 0 0;
    max-width: 54ch;
    line-height: 1.55;
  }
  .vbody b {
    color: var(--text);
    font-weight: 600;
  }
  .hypo {
    border: 1px solid var(--oxblood);
    color: var(--oxblood);
    padding: 12px 12px;
    font-family: 'Spline Sans Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    line-height: 1.7;
    text-align: center;
  }
  .hypo b {
    display: block;
    font-size: 12px;
    letter-spacing: 0.12em;
    margin-bottom: 5px;
  }

  .qblock {
    margin-top: 34px;
    border-top: 1px solid var(--rule);
  }
  .q {
    border-bottom: 1px solid var(--rule-soft);
  }
  .qhead {
    width: 100%;
    background: transparent;
    border: 0;
    cursor: pointer;
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr) auto;
    gap: 14px;
    align-items: baseline;
    padding: 15px 2px;
    text-align: left;
    color: var(--text);
  }
  .qhead:hover {
    background: var(--shade);
  }
  .qhead .tw {
    font-family: 'Spline Sans Mono', monospace;
    color: var(--text-3);
    font-size: 13px;
  }
  .qhead h3 {
    font-family: 'Syne', sans-serif;
    font-size: 19px;
    font-weight: 600;
  }
  .qhead .ans {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 13px;
    color: var(--text-2);
  }
  .qbody {
    padding: 4px 2px 24px 36px;
    display: none;
  }
  .q.open .qbody {
    display: block;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    border-top: 1px solid var(--rule-soft);
  }
  .stat {
    padding: 13px 16px 13px 0;
    border-right: 1px solid var(--rule-soft);
  }
  .stat:last-child {
    border-right: 0;
  }
  .stat .lbl {
    display: block;
  }
  .stat .n {
    display: block;
    font-size: 21px;
    margin-top: 5px;
    letter-spacing: -0.02em;
  }
  .stat .sub {
    display: block;
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .years {
    display: flex;
    gap: 3px;
    margin-top: 14px;
    align-items: flex-end;
    height: 62px;
  }
  .yr {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 100%;
  }
  .yr i {
    display: block;
    width: 100%;
  }
  .yr .cap {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 9px;
    color: var(--text-3);
    text-align: center;
    margin-top: 4px;
  }

  .ladder {
    margin-top: 14px;
  }
  .rung {
    display: grid;
    grid-template-columns: 70px minmax(0, 1fr) 92px;
    gap: 12px;
    align-items: center;
    padding: 7px 0;
  }
  .rung .lb {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 12px;
    color: var(--text-3);
  }
  .rung .bar {
    height: 9px;
    background: var(--sunk);
    position: relative;
  }
  .rung .bar i {
    position: absolute;
    top: 0;
    bottom: 0;
  }
  .rung .vv {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 12.5px;
    text-align: right;
  }

  table.trades {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  table.trades th,
  table.trades td {
    text-align: left;
    padding: 8px 12px 8px 0;
    border-bottom: 1px solid var(--rule-soft);
    font-family: 'Spline Sans Mono', monospace;
    font-size: 12.5px;
  }
  table.trades th {
    color: var(--text-3);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  table.trades td {
    color: var(--text-2);
  }
  table.trades td.pos {
    color: var(--pass);
  }
  table.trades td.neg {
    color: var(--fail);
  }
  .tablescroll {
    overflow-x: auto;
  }

  .chartwrap {
    margin-top: 18px;
    border: 1px solid var(--rule-soft);
    background: var(--raise);
    padding: 12px;
  }
  .chartwrap svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .legend {
    display: flex;
    gap: 18px;
    margin-top: 8px;
    font-family: 'Spline Sans Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    flex-wrap: wrap;
  }

  /* ---------- next ---------- */
  .recs {
    margin-top: 28px;
    border-top: 1px solid var(--rule);
  }
  .rec {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 20px;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .rec.lead {
    background: var(--blue-wash);
    padding: 20px 18px;
    border-left: 3px solid var(--blue);

<script>
  ;(function () {
    'use strict'

    /* ======================= state ======================= */

    var TEMPLATES = [
      {
        id: 'macross',
        name: '20/50 moving-average crossover',
        family: 'Trend following',
        captures:
          'Catches sustained directional moves and gives most of them back at the turn.',
        freq: 'Low',
        freqCls: 'freq-low',
        rules: 'Long when the 20 crosses above the 50; short on the reverse.',
        ex: 'EUR/USD · 4-hour · daily',
        base: 1.0,
        seed: 11,
      },
      {
        id: 'rsipull',
        name: 'RSI pullback in a trend',
        family: 'Mean reversion + trend',
        captures:
          'Buys temporary weakness while the larger trend is still intact.',
        freq: 'Medium',
        freqCls: '',
        rules: 'Trend up, RSI dips below 40, then closes back above it.',
        ex: 'US 500 · 1-hour · 4-hour',
        base: 1.9,
        seed: 29,
      },
      {
        id: 'donchian',
        name: 'Donchian range breakout',
        family: 'Trend following',
        captures:
          'Enters when price leaves a well-defined range, betting the move continues.',
        freq: 'Low',
        freqCls: 'freq-low',
        rules: 'Buy a close above the 20-bar high; exit on the 10-bar low.',
        ex: 'BTC/USD · 4-hour · daily',
        base: 0.8,
        seed: 43,
      },
      {
        id: 'bband',
        name: 'Bollinger-band reversion',
        family: 'Mean reversion',
        captures:
          'Fades stretched moves back toward the average. Hurts badly in trends.',
        freq: 'High',
        freqCls: 'freq-high',
        rules: 'Enter when price closes outside the band and returns inside.',
        ex: 'EUR/USD · 15-minute · 1-hour',
        base: 3.4,
        seed: 57,
      },
      {
        id: 'session',
        name: 'London session breakout',
        family: 'Price action',
        captures:
          'Trades the first decisive move after a quiet overnight range.',
        freq: 'Medium',
        freqCls: '',
        rules:
          'Mark the Asian range; enter on the first break after London opens.',
        ex: 'GBP/JPY · 15-minute · 1-hour',
        base: 2.2,
        seed: 71,
      },
      {
        id: 'sweep',
        name: 'Liquidity sweep + structure shift',
        family: 'SMC workflow',
        captures:
          'Waits for a stop-run beyond a prior extreme, then a shift in structure.',
        freq: 'Low',
        freqCls: 'freq-low',
        rules: 'Sweep of the prior low, then a bullish break of structure.',
        ex: 'EUR/USD · 15-minute · 1-hour',
        base: 0.65,
        seed: 89,
      },
    ]

    var S = {
      step: 0,
      template: null,
      market: 'EUR/USD',
      tf: '4-hour',
      dir: 'both',
      fast: 20,
      slow: 50,
      confirm: 'none',
      entry: 'next_open',
      stop: 'swing',
      target: '2R',
      risk: 1.0,
      maxOpen: 1,
      reality: 'typical',
      spread: 0.6,
      commission: 3.5,
      slippage: 0.4,
      years: 8,
      holdout: true,
      trials: 1,
      branchName: null,
      result: null,
      openQ: {},
    }

    var STEPS = [
      { key: 'start', title: 'Choose a starting point', eyebrow: 'Entry' },
      { key: 'rules', title: 'Define the rules', eyebrow: 'Authoring' },
      { key: 'reality', title: 'Set trading reality', eyebrow: 'Assumptions' },
      {
        key: 'history',
        title: 'Choose the history',
        eyebrow: 'Evidence window',
      },
      { key: 'run', title: 'Run the test', eyebrow: 'Execution' },
      { key: 'result', title: 'Read the verdict', eyebrow: 'Result' },
      { key: 'next', title: 'Decide what to do', eyebrow: 'Decision' },
    ]

    var stage = document.getElementById('stage')
    var logEl = document.getElementById('log')
    var crumb = document.getElementById('crumb')

    /* ======================= maths ======================= */

    function costPerTradeR() {
      var stopPips = { swing: 34, atr: 42, fixed: 25 }[S.stop]
      var costPips = S.spread + S.slippage + S.commission / 10
      return costPips / stopPips
    }

    function compute() {
      var t = S.template || TEMPLATES[0]
      var tfMult = {
        '15-minute': 5.4,
        '1-hour': 2.1,
        '4-hour': 1.0,
        daily: 0.32,
      }[S.tf]
      var confirmMult = { none: 1, engulf: 0.46, close: 0.72, pin: 0.34 }[
        S.confirm
      ]
      var dirMult = { long: 0.52, short: 0.48, both: 1 }[S.dir]

      var perYear = 38 * t.base * tfMult * confirmMult * dirMult
      var trades = Math.max(4, Math.round(perYear * S.years))

      /* parameter sensitivity — 20/50 is the sweet spot for the crossover */
      var sweet =
        t.id === 'macross'
          ? Math.abs(S.fast - 20) / 22 + Math.abs(S.slow - 50) / 60
          : 0.12
      var paramFit = Math.max(0.1, 1 - Math.min(0.9, sweet))

      /* gross edge in R, before costs */
      var famEdge = {
        macross: 0.3,
        rsipull: 0.22,
        donchian: 0.34,
        bband: 0.11,
        session: 0.19,
        sweep: 0.28,
      }[t.id]
      var targetMult = { '1.5R': 0.92, '2R': 1.0, '3R': 0.88, signal: 0.96 }[
        S.target
      ]
      var confirmEdge = { none: 0.85, engulf: 1.14, close: 1.0, pin: 1.2 }[
        S.confirm
      ]
      var grossR = famEdge * paramFit * targetMult * confirmEdge

      var costR = costPerTradeR()
      var netR = grossR - costR

      var netPct = trades * netR * S.risk
      var breakEven = grossR / Math.max(costR, 0.0001)

      /* drawdown grows with risk, trade count, and thin edge */
      var ddPct = -Math.min(
        72,
        (5.2 + Math.abs(netR) * 0 + 9.5 * S.risk) *
          (1 + Math.max(0, 0.6 - netR * 2)) *
          (1 + Math.log(Math.max(trades, 10) / 100 + 1)),
      )
      var streak = Math.max(
        4,
        Math.round(
          7 +
            (1 - Math.min(netR * 3, 1)) * 9 +
            Math.log(Math.max(trades, 10)) * 0.6,
        ),
      )

      var holdTrades = Math.round(trades * 0.22)
      var holdNetR = netR - 0.035 /* unseen data is always a little worse */
      var holdPct = holdTrades * holdNetR * S.risk

      /* year-by-year */
      var yrs = [],
        seed = t.seed + S.years * 7 + Math.round(S.fast) * 3
      var goodYears = 0
      for (var i = 0; i < S.years; i++) {
        seed = (seed * 1103515245 + 12345) % 2147483648
        var noise = (seed / 2147483648 - 0.5) * 2
        var y = netR * (trades / S.years) * S.risk + noise * (7 * S.risk + 3)
        yrs.push(y)
        if (y > 0) goodYears++
      }

      var costShare = Math.min(0.99, costR / Math.max(grossR, 0.0001))

      /* rubric */
      var verdict, tone, why
      if (trades < 100) {
        verdict = 'Too little evidence'
        tone = 'warn'
        why =
          'Only <b>' +
          trades +
          ' trades</b> across ' +
          S.years +
          ' years, and <b>' +
          holdTrades +
          '</b> on the unseen period. Below the 100-trade floor, this result cannot be separated from luck in either direction.'
      } else if (holdPct <= 0 || netR <= 0) {
        verdict = 'Unprofitable'
        tone = 'bad'
        why =
          'On the unseen period the strategy loses money: <b>' +
          fmtPct(holdPct) +
          '</b> across ' +
          holdTrades +
          ' trades. Costs alone consume <b>' +
          Math.round(costShare * 100) +
          '%</b> of the gross edge. The rubric treats this as decisive.'
      } else if (breakEven < 1.6 || paramFit < 0.62 || ddPct < -32) {
        verdict = 'Fragile'
        tone = 'warn'
        why =
          'It made money, but the margin is thin: the edge disappears at <b>' +
          breakEven.toFixed(1) +
          '× costs</b>' +
          (paramFit < 0.62 ? ' and it only works near one exact setting' : '') +
          '. You would have held through a <b>' +
          fmtPct(ddPct) +
          '</b> drawdown and <b>' +
          streak +
          '</b> losses in a row.'
      } else if (
        breakEven > 2.6 &&
        goodYears / S.years >= 0.75 &&
        paramFit > 0.85
      ) {
        verdict = 'Strong evidence'
        tone = 'pass'
        why =
          'Positive on the unseen period, in <b>' +
          goodYears +
          ' of ' +
          S.years +
          '</b> calendar years, and still positive at <b>' +
          Math.min(3, breakEven).toFixed(1) +
          '× costs</b>. This is as good as a backtest gets — which is still not proof.'
      } else {
        verdict = 'Promising'
        tone = 'pass'
        why =
          'Positive expectancy on the unseen period and profitable in <b>' +
          goodYears +
          ' of ' +
          S.years +
          '</b> years. At ' +
          S.risk.toFixed(2) +
          '% risk you would have sat through a <b>' +
          fmtPct(ddPct) +
          '</b> drawdown and a run of <b>' +
          streak +
          '</b> losses.'
      }

      return {
        trades: trades,
        perMonth: trades / (S.years * 12),
        netR: netR,
        grossR: grossR,
        costR: costR,
        netPct: netPct,
        holdPct: holdPct,
        holdTrades: holdTrades,
        breakEven: breakEven,
        ddPct: ddPct,
        streak: streak,
        yrs: yrs,
        goodYears: goodYears,
        costShare: costShare,
        paramFit: paramFit,
        verdict: verdict,
        tone: tone,
        why: why,
        endBal: 10000 * (1 + netPct / 100),
        winRate: Math.max(
          18,
          Math.min(
            72,
            33 +
              netR * 40 +
              (S.target === '1.5R' ? 9 : S.target === '3R' ? -8 : 0),
          ),
        ),
      }
    }

    function fmtPct(x) {
      return (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1) + '%'
    }
    function money(x) {
      return '£' + Math.round(x).toLocaleString()
    }

    /* ======================= spine ======================= */

    function summaryFor(i) {
      var r = S.result
      switch (i) {
        case 0:
          return S.template ? S.template.name : '—'
        case 1:
          return (
            S.market +
            ' · ' +
            S.tf +
            ' · ' +
            (S.dir === 'both' ? 'long + short' : S.dir) +
            ' · ' +
            S.risk.toFixed(2) +
            '% risk'
          )
        case 2:
          return S.reality === 'typical'
            ? 'Typical costs · ' + S.spread + ' pip spread'
            : S.reality === 'conservative'
              ? 'Conservative · ' + S.spread + ' pip + ' + S.slippage + ' slip'
              : 'Custom · ' +
                S.spread +
                ' / ' +
                S.slippage +
                ' / £' +
                S.commission
        case 3:
          return (
            S.years +
            ' years' +
            (S.holdout ? ' · holdout locked' : ' · no holdout')
          )
        case 4:
          return '18,432 candidate entries'
        case 5:
          return r ? r.verdict + ' · ' + fmtPct(r.holdPct) + ' unseen' : '—'
        case 6:
          return S.branchName || 'awaiting decision'
      }
      return ''
    }

    function renderLog() {
      logEl.innerHTML = ''
      STEPS.forEach(function (st, i) {
        var li = document.createElement('li')
        var b = document.createElement('button')
        b.type = 'button'
        b.className =
          'entry' +
          (i < S.step ? ' done' : '') +
          (i === S.step ? ' here' : '') +
          (S.branchName && i === 6 ? ' branch' : '')
        var time = new Date(2026, 7, 25, 9, 14 + i * 3, 0)
        b.innerHTML =
          '<span class="t">' +
          String(time.getHours()).padStart(2, '0') +
          ':' +
          String(time.getMinutes()).padStart(2, '0') +
          '</span>' +
          '<span class="h">' +
          st.title +
          '</span>' +
          (i <= S.step ? '<span class="s">' + summaryFor(i) + '</span>' : '')
        if (i < S.step)
          b.addEventListener('click', function () {
            go(i)
          })
        li.appendChild(b)
        logEl.appendChild(li)
      })
      document.getElementById('trialN').textContent = S.trials
      crumb.innerHTML =
        '<b>' +
        (S.template ? S.template.name : 'New test') +
        '</b> · ' +
        S.market +
        ' ' +
        S.tf +
        ' · trial ' +
        S.trials
    }

    /* ======================= steps ======================= */

    function go(i) {
      S.step = i
      render()
      window.scrollTo({ top: 0, behavior: 'instant' })
    }

    function head(i, sub) {
      var st = STEPS[i]
      return (
        '<div class="step-eyebrow"><span class="lbl">Step ' +
        (i + 1) +
        ' / 7 · ' +
        st.eyebrow +
        '</span></div>' +
        '<h1 class="step">' +
        st.title +
        '</h1>' +
        (sub ? '<p class="step-sub">' + sub + '</p>' : '')
      )
    }

    function sparkPath(seed, kind) {
      var s = seed,
        pts = [],
        v = 20
      for (var i = 0; i < 40; i++) {
        s = (s * 1103515245 + 12345) % 2147483648
        var n = s / 2147483648 - 0.5
        v +=
          kind === 'trend'
            ? n * 3 + 0.35
            : kind === 'revert'
              ? -(v - 20) * 0.22 + n * 5
              : n * 4
        pts.push(v)
      }
      var d = 'M0 ' + (34 - pts[0] * 0.8).toFixed(1)
      for (var j = 1; j < pts.length; j++)
        d +=
          ' L' +
          ((j / 39) * 240).toFixed(1) +
          ' ' +
          (34 - pts[j] * 0.8).toFixed(1)
      return d
    }

    /* ---- step 0 ---- */
    function stepStart() {
      var h = head(
        0,
        'Six templates the engine can express honestly, end to end. Everything on a card is editable at the next step — nothing here is advice.',
      )
      h += '<div class="cards">'
      TEMPLATES.forEach(function (t) {
        var kind =
          t.family.indexOf('Mean') === 0
            ? 'revert'
            : t.family.indexOf('Trend') === 0
              ? 'trend'
              : 'mixed'
        h +=
          '<button class="card' +
          (S.template && S.template.id === t.id ? ' sel' : '') +
          '" data-t="' +
          t.id +
          '" type="button">' +
          '<span class="lbl">' +
          t.family +
          '</span>' +
          '<h3>' +
          t.name +
          '</h3>' +
          '<p>' +
          t.captures +
          '</p>' +
          '<svg class="spark" viewBox="0 0 240 34" preserveAspectRatio="none" aria-hidden="true">' +
          '<path d="' +
          sparkPath(t.seed, kind) +
          '" fill="none" stroke="var(--blue)" stroke-width="1.2" opacity=".75"></path></svg>' +
          '<span class="meta"><span class="pill ' +
          t.freqCls +
          '">' +
          t.freq +
          ' frequency</span>' +
          '<span class="pill">' +
          t.ex.split(' · ')[0] +
          '</span></span></button>'
      })
      h += '</div>'
      h +=
        '<div class="flag">Two other ways in: <b>describe your own strategy</b> in plain language, or <b>reopen a saved test</b>. ' +
        'Both land in the same authoring step — templates are a head start, not a separate product.</div>'
      h +=
        '<div class="actions"><button class="primary" id="next"' +
        (S.template ? '' : ' disabled') +
        '>Customise and test</button>' +
        '<span class="hint">' +
        (S.template ? S.template.rules : 'Pick a template to continue') +
        '</span></div>'
      stage.innerHTML = h

      ;[].forEach.call(stage.querySelectorAll('.card'), function (c) {
        c.addEventListener('click', function () {
          S.template = TEMPLATES.filter(function (t) {
            return t.id === c.dataset.t
          })[0]
          S.tf = S.template.ex.split(' · ')[1]
          render()
        })
      })
      stage.querySelector('#next').addEventListener('click', function () {
        go(1)
      })
    }

    /* ---- step 1 ---- */
    function seg(name, opts, cur) {
      var h = '<span class="seg" data-seg="' + name + '">'
      opts.forEach(function (o) {
        h +=
          '<button type="button" data-v="' +
          o[0] +
          '" aria-pressed="' +
          (cur === o[0]) +
          '">' +
          o[1] +
          '</button>'
      })
      return h + '</span>'
    }

    function stepRules() {
      var r = compute()
      var few = r.trades < 100
      var h = head(
        1,
        'One row per decision, in trading language. The right-hand column is live: it recounts against eight years of history every time you change something.',
      )

        '<div class="field"><span class="lbl">Market</span><div class="ctl">' +
        seg(
          'market',
          [
            ['EUR/USD', 'EUR/USD'],
            ['GBP/JPY', 'GBP/JPY'],
            ['BTC/USD', 'BTC/USD'],
            ['US 500', 'US 500'],
          ],
          S.market,
        ) +
        '</div><span class="tail">spread 0.6 pip</span></div>'

      h +=
        '<div class="field"><span class="lbl">Timeframe</span><div class="ctl">' +
        seg(
          'tf',
          [
            ['15-minute', '15m'],
            ['1-hour', '1H'],
            ['4-hour', '4H'],
            ['daily', '1D'],
          ],
          S.tf,
        ) +
        '</div><span class="tail">' +
        Math.round(r.trades / S.years) +
        ' trades / year</span></div>'

      h +=
        '<div class="field"><span class="lbl">Direction</span><div class="ctl">' +
        seg(
          'dir',
          [
            ['long', 'Long only'],
            ['short', 'Short only'],
            ['both', 'Long and short'],
          ],
          S.dir,
        ) +
        '</div><span class="tail">separate rule branches</span></div>'

      if (S.template && S.template.id === 'macross') {
        h +=
          '<div class="field"><span class="lbl">Setup</span><div class="ctl">' +
          '<span>the <input class="num-in" type="number" id="fast" value="' +
          S.fast +
          '" min="5" max="60"> period average crosses the ' +
          '<input class="num-in" type="number" id="slow" value="' +
          S.slow +
          '" min="20" max="200"> period average</span>' +
          '</div><span class="tail' +
          (r.paramFit < 0.62 ? ' warnt' : '') +
          '">' +
          (r.paramFit < 0.62
            ? 'far from a stable region'
            : 'nearby settings also work') +
          '</span></div>'
      } else {
        h +=
          '<div class="field"><span class="lbl">Setup</span><div class="ctl"><span>' +
          S.template.rules +
          '</span></div><span class="tail">template default</span></div>'
      }

      h +=
        '<div class="field"><span class="lbl">Entry confirmation</span><div class="ctl">' +
        seg(
          'confirm',
          [
            ['none', 'None'],
            ['close', 'Close beyond'],
            ['engulf', 'Engulfing candle'],
            ['pin', 'Pin bar'],
          ],
          S.confirm,
        ) +
        '</div><span class="tail' +
        (few ? ' warnt' : '') +
        '">' +
        r.trades.toLocaleString() +
        ' trades survive</span></div>'

      h +=
        '<div class="field"><span class="lbl">Entry timing</span><div class="ctl">' +
        seg(
          'entry',
          [
            ['next_open', 'Next bar open'],
            ['close', 'This bar close'],
            ['limit', 'Limit at average'],
          ],
          S.entry,
        ) +
        '</div><span class="tail">' +
        (S.entry === 'next_open' ? 'executable' : 'not yet executable') +
        '</span></div>'

      h +=
        '<div class="field"><span class="lbl">Stop</span><div class="ctl">' +
        seg(
          'stop',
          [
            ['swing', 'Below recent swing'],
            ['atr', '1.5 ATR'],
            ['fixed', 'Fixed 25 pips'],
          ],
          S.stop,
        ) +
        '</div><span class="tail">costs = ' +
        r.costR.toFixed(3) +
        'R</span></div>'

      h +=
        '<div class="field"><span class="lbl">Target</span><div class="ctl">' +
        seg(
          'target',
          [
            ['1.5R', '1.5R'],
            ['2R', '2R'],
            ['3R', '3R'],
            ['signal', 'Opposite signal'],
          ],
          S.target,
        ) +
        '</div><span class="tail">win rate ≈ ' +
        Math.round(r.winRate) +
        '%</span></div>'

      h +=
        '<div class="field"><span class="lbl">Risk per trade</span><div class="ctl">' +
        seg(
          'risk',

      var W = 660,

        Math.round(S.risk * 100)
      var mid = [],

        hi = [],
        v = 1,
        a = 1,
        b = 1
      var per = r.netPct / 100 / N
      var vol = 0.012 * S.risk * (1 + r.costR * 2)
      for (var i = 0; i < N; i++) {
        s = (s * 1103515245 + 12345) % 2147483648
        var n = s / 2147483648 - 0.5
        var step = per + n * vol
        v *= 1 + step
        a *= 1 + step - Math.abs(n) * 0.004
        b *= 1 + step + Math.abs(n) * 0.003
        mid.push(v)
        lo.push(a)
        hi.push(b)

      var all = lo.concat(hi).concat([1])
      var mn = Math.min.apply(null, all),

      mx += pad

      function Y(val) {

        var d = 'M0 ' + Y(arr[0]).toFixed(1)

        H +

              var win = n > 1 - r.winRate / 100
              var rr = win
                ? S.target === '3R'
                  ? 3
                  : S.target === '1.5R'
                    ? 1.5
                    : 2
                : -1
              rows +=
                '<tr><td>' +
                (2019 + (i % S.years)) +
                '-0' +
                ((i % 9) + 1) +
                '-1' +
                (i + 2) +
                '</td><td>' +
                (i % 2 ? 'Short' : 'Long') +
                '</td><td>' +
                (1.0821 + i * 0.0037).toFixed(4) +
                '</td><td>' +
                (i % 3 ? 'target' : 'stop') +
                '</td><td class="' +
                (win ? 'pos' : 'neg') +
                '">' +
                (win ? '+' : '') +
                rr.toFixed(1) +
                'R</td><td>' +
                (win ? '+' : '−') +
                '£' +
                Math.abs(Math.round(rr * S.risk * 100)) +
                '</td></tr>'
            }
            return (
              '<div class="tablescroll"><table class="trades"><thead><tr><th>Date</th><th>Side</th><th>Entry</th><th>Exit</th><th>Result</th><th>P&L</th></tr></thead><tbody>' +
              rows +
              '</tbody></table></div>' +
              '<p style="margin-top:14px;color:var(--text-2);font-size:14.5px;max-width:60ch">Every row opens the chart at that bar with the conditions that passed listed beside it — and the near-miss view answers the harder question, <b>why was there no trade here?</b></p>'
            )
          },
        },
      ]

      h += '<div class="qblock">'
      qs.forEach(function (q) {
        var open = S.openQ[q.id]
        h +=
          '<div class="q' +
          (open ? ' open' : '') +
          '" data-q="' +
          q.id +
          '">' +
          '<button class="qhead" type="button"><span class="tw">' +
          (open ? '−' : '+') +
          '</span>' +
          '<h3>' +
          q.q +
          '</h3><span class="ans">' +
          q.ans +
          '</span></button>' +
          '<div class="qbody">' +
          (open ? q.body() : '') +
          '</div></div>'
      })
      h += '</div>'

      h +=
        '<div class="actions"><button class="primary" id="next">See what to do next</button>' +
        '<button class="back" id="back">Change the assumptions</button>' +
        '<span class="hint">every change re-runs and counts as a trial</span></div>'

      stage.innerHTML = h
      ;[].forEach.call(stage.querySelectorAll('.q'), function (el) {
        el.querySelector('.qhead').addEventListener('click', function () {
          S.openQ[el.dataset.q] = !S.openQ[el.dataset.q]
          render()
        })
      })
      stage.querySelector('#next').addEventListener('click', function () {
        go(6)
      })
      stage.querySelector('#back').addEventListener('click', function () {
        go(2)
      })
    }

    function stat(l, n, sub) {
      return (
        '<div class="stat"><span class="lbl">' +
        l +
        '</span><span class="n">' +
        n +
        '</span><span class="sub">' +
        sub +
        '</span></div>'
      )
    }

    /* ---- step 6 ---- */
    function stepNext() {
      var r = S.result || compute()
      var lead, rest

      if (r.trades < 100) {
        lead = {
          t: 'Simplify the rules',
          why:
            'Only ' +
            r.trades +
            ' trades is not enough evidence to judge anything. Drop the entry confirmation or move to a faster chart until the test produces at least 100 independent trades, then re-run.',
          act: 'Loosen and retest',
          step: 1,
        }
      } else if (r.holdPct <= 0 || r.netR <= 0) {
        lead = {
          t: 'Rewrite the hypothesis',
          why: 'Expectancy on unseen data is negative. Adjusting parameters from here is data mining — the honest next move is a different idea, not a different setting.',
          act: 'Start a new hypothesis',
          step: 0,
        }
      } else if (r.costShare > 0.45) {
        lead = {
          t: 'Retest under higher costs',
          why:
            'Costs consume ' +
            Math.round(r.costShare * 100) +
            '% of the gross edge, so the result depends more on your broker than on your idea. Run it again at conservative fills before believing it.',
          act: 'Apply conservative costs',
          step: 2,
        }
      } else if (Math.abs(r.ddPct) > 25) {
        lead = {
          t: 'Reduce risk',
          why:
            'Expectancy is positive but a ' +
            fmtPct(r.ddPct) +
            ' drawdown at ' +
            S.risk.toFixed(2) +
            '% risk is more than most people hold through. The same rules at 0.5% would have drawn down ' +
            fmtPct((r.ddPct * 0.5) / S.risk) +
            '.',
          act: 'Halve the risk and re-run',
          step: 1,
        }
      } else if (r.paramFit < 0.7) {
        lead = {
          t: 'Test a nearby setting range',
          why: 'Only this exact pair of averages works. Run the whole neighbourhood and judge the region, not the point — if the region fails, the point was luck.',
          act: 'Sweep nearby settings',
          step: 1,
        }
      } else {
        lead = {
          t: 'Paper trade this version',
          why:
            'The evidence is as good as a backtest gets: positive on unseen data, stable across nearby settings, and it survives ' +
            r.breakEven.toFixed(1) +
            '× costs. Forward-test it before risking money — never go live off a backtest.',
          act: 'Freeze and paper trade',
          step: 6,
        }
      }

      rest = [
        {
          t: 'Test another market',
          why: 'If the hypothesis is really about trend persistence, it should survive on GBP/JPY too. If it only works here, it was fitted to this instrument.',
          act: 'Run on GBP/JPY',
          step: 1,
        },
        {
          t: 'Retest under conservative fills',
          why: 'Doubles spread and slippage. The fastest way to find out how much of the edge belongs to your broker.',
          act: 'Apply and re-run',
          step: 2,
        },
        {
          t: 'Extend the window',
          why: 'Add the earliest available history so the test spans more than one regime.',
          act: 'Use the longest window',
          step: 3,
        },
        {
          t: 'Discard this idea',
          why: 'Log it as tested and closed, with everything needed to reproduce the result. A dead end you can prove is worth more than one you keep revisiting.',
          act: 'Archive the run',
          step: 6,
        },
      ]

      var h = head(
        6,
        'One recommendation, chosen from the result rather than offered as a menu of ways to keep tweaking until the number turns green.',
      )
      h += '<div class="recs">'
      h +=
        '<div class="rec lead"><div><span class="lbl">Recommended</span><h3>' +
        lead.t +
        '</h3><p>' +
        lead.why +
        '</p></div><button type="button" data-step="' +
        lead.step +
        '" data-name="' +
        lead.t +
        '">' +
        lead.act +
        '</button></div>'
      rest.forEach(function (x) {
        h +=
          '<div class="rec"><div><h3>' +
          x.t +
          '</h3><p>' +
          x.why +
          '</p></div><button type="button" data-step="' +
          x.step +
          '" data-name="' +
          x.t +
          '">' +
          x.act +
          '</button></div>'
      })
      h += '</div>'

      h +=
        '<div class="notice">Each of these starts a <b>named experiment</b> branched off this run. The trial counter goes up, the ' +
        'previous result stays in the log for side-by-side comparison, and the next verdict shows both numbers so an improvement ' +
        'always appears next to how many attempts it took.<br><br>Assay never recommends going live, and it will not keep suggesting ' +
        'parameter tweaks until a profitable result appears. When unseen-period expectancy is negative, the only recommendation is to ' +
        'rewrite the hypothesis.</div>'

      h +=
        '<div class="actions"><button class="back" id="back">Back to the result</button></div>'

      stage.innerHTML = h
      ;[].forEach.call(stage.querySelectorAll('.rec button'), function (b) {
        b.addEventListener('click', function () {
          S.trials += 1
          S.branchName = b.dataset.name
          if (b.dataset.name === 'Test another market') S.market = 'GBP/JPY'
          if (
            b.dataset.name.indexOf('conservative') > -1 ||
            b.dataset.name === 'Retest under higher costs'
          ) {
            S.reality = 'conservative'
            applyPreset('conservative')
          }
          if (b.dataset.name === 'Reduce risk') S.risk = 0.5
          if (b.dataset.name === 'Extend the window') S.years = 10
          if (b.dataset.name === 'Rewrite the hypothesis') {
            S.template = null
            S.branchName = null
          }
          go(+b.dataset.step === 6 ? 5 : +b.dataset.step)
        })
      })
      stage.querySelector('#back').addEventListener('click', function () {
        go(5)
      })
    }

    /* ======================= render ======================= */

    function render() {
      renderLog()
      ;[
        stepStart,
        stepRules,
        stepReality,
        stepHistory,
        stepRun,
        stepResult,
        stepNext,
      ][S.step]()
    }

    document.getElementById('themeBtn').addEventListener('click', function () {
      var root = document.documentElement,
        cur = root.getAttribute('data-theme')
      if (!cur)
        cur = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
      root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark')
    })
    document.getElementById('restart').addEventListener('click', function () {
      clearTimeout(runTimer)
      S.step = 0
      S.template = null
      S.trials = 1
      S.branchName = null
      S.result = null
      S.market = 'EUR/USD'
      S.risk = 1
      S.years = 8
      S.confirm = 'none'
      S.dir = 'both'
      S.reality = 'typical'
      applyPreset('typical')
      S.openQ = {}
      render()
    })

    render()
  })()
</script>
