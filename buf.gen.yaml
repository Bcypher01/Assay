version: v1
plugins:
  # Local plugins are pinned by `go.mod` and installed by `make tools`. Remote
  # plugins silently move to new major versions (connect-go v2 needs a different
  # runtime module), which would break the build on an unrelated regeneration.
  - plugin: go
    out: gen/go
    opt: paths=source_relative
  - plugin: connect-go
    out: gen/go
    opt: paths=source_relative
  # The web client generates its own TypeScript stubs from the same source;
  # see web/ (npm run generate-rpc). No UI code lives in this repo.
