syntax = "proto3";

package assay.v1;

option go_package = "github.com/bcypher01/assay/gen/go/assay/v1;assayv1";

// SampleParams proves the parameter contract used by every primitive pack:
// this one definition generates the Go model and the standalone UI's model.
message SampleParams {
  uint32 period = 1;
  bool enabled = 2;
}

message MovingAverageParams { uint32 period = 1; }
message RsiParams { uint32 period = 1; }
message AtrParams { uint32 period = 1; }
message PeriodParams { uint32 period = 1; }
message SlopeParams { uint32 period = 1; }
message MovingAverageTouchParams { uint32 period = 1; uint32 tolerance_ticks = 2; }
message MovingAverageCrossParams { uint32 fast_period = 1; uint32 slow_period = 2; }
message MacdParams { uint32 fast_period = 1; uint32 slow_period = 2; uint32 signal_period = 3; }
message BollingerBandsParams { uint32 period = 1; uint32 width_milli = 2; }
message AdxParams { uint32 period = 1; }
message StochasticParams { uint32 period = 1; }
message SwingParams { uint32 left = 1; uint32 right = 2; }
message ClusterParams { uint32 lookback = 1; uint32 tolerance_ticks = 2; }
message PinBarParams { uint32 body_ratio_milli = 1; uint32 wick_ratio_milli = 2; }
message DojiParams { uint32 body_ratio_milli = 1; }
message RangeParams { uint32 period = 1; uint32 max_width_ticks = 2; }
message MeasuredMoveParams { uint32 period = 1; }
message SessionParams { uint32 start_minute_utc = 1; uint32 end_minute_utc = 2; }
message DayOfWeekParams { repeated uint32 days = 1; }
message TimeOfDayRangeParams { uint32 start_minute_utc = 1; uint32 end_minute_utc = 2; }
message BarOfSessionParams { uint32 start_minute_utc = 1; uint32 end_minute_utc = 2; }
// PeriodExtremeParams selects a completed bar of the node's own timeframe.
// lookback 0 is the most recently completed bar, 1 the one before it. Read from
// a finer entry chart, a D1 node with lookback 0 is the previous day's high or
// low, and a W1 node the previous week's.
message PeriodExtremeParams { uint32 lookback = 1; }
// OpeningRangeParams is the range of the first minutes after a session opens.
// The level is invalid until that window has closed, so a breakout can only
// reference a range that is already fixed.
message OpeningRangeParams { uint32 start_minute_utc = 1; uint32 range_minutes = 2; }
// VwapParams anchors a volume-weighted average price to a session open.
// Volume is whatever the feed supplies: broker-native FX volume is a tick
// count, not traded size, so a VWAP on such a symbol is tick-weighted and every
// surface that shows it has to say so.
message VwapParams { uint32 start_minute_utc = 1; uint32 end_minute_utc = 2; }

// Smart-money concepts deliberately expose the choices that differ among
// trading schools. All sizes are integer ticks or thousandths, never floats.
message MarketStructureParams { uint32 swing_lookback = 1; bool confirm_by_close = 2; uint32 equal_level_tolerance_ticks = 3; bool track_internal = 4; }
message DisplacementParams { uint32 min_body_ratio_milli = 1; uint32 min_consecutive_bars = 2; bool require_gap = 3; }
enum MitigationRule { MITIGATION_RULE_UNSPECIFIED = 0; MITIGATION_RULE_FIRST_TOUCH = 1; MITIGATION_RULE_HALF_FILL = 2; MITIGATION_RULE_FULL_FILL = 3; }
message FairValueGapParams { uint32 min_size_ticks = 1; MitigationRule mitigation_rule = 2; uint32 expiry_bars = 3; bool track_inverted = 4; }
message OrderBlockParams { uint32 cluster_bars = 1; bool use_body = 2; bool must_be_unmitigated = 3; uint32 displacement_within_bars = 4; uint32 min_body_ratio_milli = 5; }
message BreakerParams { uint32 invalidating_touches = 1; bool flip_on_close = 2; }
message LiquidityPoolParams { uint32 equal_level_tolerance_ticks = 1; uint32 min_touches = 2; uint32 age_bars = 3; }
message SweepParams { uint32 wick_through_ticks = 1; uint32 close_back_bars = 2; bool require_structure_shift = 3; }
message PremiumDiscountParams { uint32 dealing_range_bars = 1; uint32 ote_lower_milli = 2; uint32 ote_upper_milli = 3; }
