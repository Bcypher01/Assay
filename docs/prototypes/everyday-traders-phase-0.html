<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assay — Phase 0 prototype</title>
  <style>
    :root { --ink:#11212a; --muted:#60717b; --line:#d9e1e3; --paper:#fff; --ground:#f2f5f5; --blue:#066f91; --blue-dark:#04556f; --good:#17734c; --warn:#97660c; --bad:#a43e32; }
    * { box-sizing:border-box; } body { margin:0; background:var(--ground); color:var(--ink); font:16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    button, input, select, textarea { font:inherit; } button { cursor:pointer; } button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #72c9e3; outline-offset:2px; }
    .shell { min-height:100vh; display:grid; grid-template-columns:255px minmax(0,1fr); }
    aside { background:#102a35; color:#e7f1f3; padding:28px 22px; } .brand { font-weight:800; font-size:22px; letter-spacing:.08em; text-transform:uppercase; } .brand span { color:#65d1eb; }
    .eyebrow { margin:5px 0 30px; color:#9db0b6; font-size:11px; letter-spacing:.12em; text-transform:uppercase; } ol { padding:0; margin:0; list-style:none; counter-reset:steps; } li { counter-increment:steps; display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-top:1px solid #29414b; color:#a8bbc1; font-size:14px; } li::before { content:counter(steps, decimal-leading-zero); font:12px ui-monospace,monospace; color:#71909a; } li.active { color:white; font-weight:700; } li.active::before { color:#65d1eb; }
    main { width:min(940px,100%); margin:auto; padding:48px 44px 80px; } .top { display:flex; justify-content:space-between; gap:15px; align-items:center; margin-bottom:44px; } .pill { display:inline-block; border:1px solid #a9c5cf; background:#e9f7fa; color:#075f7c; padding:4px 9px; border-radius:999px; font-size:12px; font-weight:700; } .restart { border:0; color:var(--blue); background:transparent; text-decoration:underline; }
    h1 { font-size:clamp(30px,5vw,54px); max-width:760px; line-height:1.04; letter-spacing:-.04em; margin:0 0 15px; } h2 { margin:0 0 10px; font-size:24px; letter-spacing:-.02em; } h3 { margin:0 0 7px; font-size:17px; } p { color:var(--muted); max-width:68ch; } .lede { font-size:19px; margin-bottom:30px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } .card, .panel { background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:22px; box-shadow:0 6px 22px #102a3508; } .card { text-align:left; } .card:hover { border-color:#65b8d0; transform:translateY(-1px); } .card .icon { font-size:29px; } .card p { font-size:14px; margin:7px 0 0; }
    .primary, .secondary { border:0; border-radius:8px; padding:12px 17px; font-weight:750; } .primary { color:white; background:var(--blue); } .primary:hover { background:var(--blue-dark); } .secondary { color:var(--blue); background:#eaf6f9; } .actions { margin-top:29px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }.notice { padding:15px 18px; border-left:4px solid var(--warn); background:#fff9ec; color:#5e4a18; font-size:14px; }
    .rule { padding:14px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:20px; align-items:center; } .rule:first-child { border:0; } .rule strong { display:block; } .rule span { color:var(--muted); font-size:14px; } label { display:block; font-weight:700; font-size:14px; } input, select, textarea { width:100%; border:1px solid #b9c9ce; border-radius:7px; background:white; padding:10px; margin-top:6px; } textarea { min-height:140px; resize:vertical; }.fields { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .metric { padding:17px; border-radius:10px; background:#f5f8f8; } .metric b { display:block; font-size:29px; letter-spacing:-.04em; } .metric small { color:var(--muted); }.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0; }.good { color:var(--good); }.bad { color:var(--bad); }.result { border-left:5px solid var(--warn); }.result h2 { color:#6e4c00; }.check { padding:0; list-style:none; }.check li { display:block; padding:9px 0; color:var(--ink); border-top:1px solid var(--line); }.check li::before { content:'✓'; margin-right:9px; color:var(--good); font-weight:900; }
    .hidden { display:none; } .footnote { margin-top:26px; font-size:12px; color:var(--muted); } @media(max-width:720px) { .shell { display:block; } aside { padding:17px; } aside ol { display:none; } main { padding:32px 19px 50px; } .grid, .metrics, .fields { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="shell">
  <aside><div class="brand">Assay<span>.</span></div><div class="eyebrow">Research prototype · Phase 0</div><ol id="steps"><li class="active">Choose a starting point</li><li>Define the rules</li><li>Set trading reality</li><li>Prepare the test</li><li>Understand the result</li><li>Decide what to do</li></ol></aside>
  <main><div class="top"><span class="pill">Illustrative historical simulation</span><button class="restart" id="restart">Start over</button></div><section id="stage"></section></main>
</div>
<script>
  const state={step:0, path:'template', cost:'typical', risk:1, custom:''};
  const stage=document.querySelector('#stage'), steps=[...document.querySelectorAll('#steps li')];
  const next=()=>{state.step=Math.min(5,state.step+1); render()}; const back=()=>{state.step=Math.max(0,state.step-1);render()};
  const action=(label, fn='next', cls='primary')=>`<button class="${cls}" data-action="${fn}">${label}</button>`;
  function render(){ steps.forEach((el,i)=>el.classList.toggle('active',i===state.step)); const screens=[start,rules,reality,prepare,result,decision]; screens[state.step](); bind(); }
  function start(){stage.innerHTML=`<h1>Turn a trading idea into a decision you can explain.</h1><p class="lede">Start with a familiar strategy, or write the rules you already use. Assay makes every assumption visible before it shows a result.</p><div class="grid"><button class="card" data-path="template"><div class="icon">↗</div><h2>Use a popular strategy</h2><p>Begin with a 20/50 moving-average crossover for EUR/USD, then customize it.</p></button><button class="card" data-path="custom"><div class="icon">✎</div><h2>Describe my own strategy</h2><p>Put your idea into plain language. We will show which parts need exact rules.</p></button></div><p class="footnote">This research prototype does not use live data or make investment recommendations.</p>`}
  function rules(){if(state.path==='custom'){stage.innerHTML=`<h1>Describe your trading rules.</h1><p class="lede">Use your own words. We will use this to learn which phrases need better guidance.</p><div class="panel"><label>When do you enter, where is your stop and target, and how much do you risk?<textarea id="custom" placeholder="Example: I buy EUR/USD when price returns to the 20-period average in an uptrend, after a bullish candle…">${state.custom}</textarea></label><p class="notice">Before testing, every phrase must become an exact rule. “A good setup” is not yet testable.</p></div><div class="actions">${action('Continue to trading reality')}${action('Back','back','secondary')}</div>`;return} stage.innerHTML=`<h1>Here is the strategy in exact rules.</h1><p class="lede">Read these as if you had to place each trade yourself. Can you explain both directions?</p><div class="panel"><div class="rule"><div><strong>Market and chart</strong><span>EUR/USD · daily bars · 2016–2025</span></div></div><div class="rule"><div><strong>Go long</strong><span>when the 20-period average crosses above the 50-period average.</span></div></div><div class="rule"><div><strong>Go short</strong><span>when the 20-period average crosses below the 50-period average.</span></div></div><div class="rule"><div><strong>Enter</strong><span>at the next bar open, not on the signal candle.</span></div></div><div class="rule"><div><strong>Risk and exit</strong><span>risk 1% per trade; stop at 1R and target at 2R.</span></div></div></div><div class="actions">${action('These rules are clear')}${action('Back','back','secondary')}</div>`}
  function reality(){stage.innerHTML=`<h1>Make the historical test less forgiving.</h1><p class="lede">Costs and position size change the experience. Choose an assumption you would accept before seeing the result.</p><div class="panel"><div class="fields"><label>Risk per trade<select id="risk"><option value="1">1% of account</option><option value="0.5">0.5% of account</option></select></label><label>Cost assumptions<select id="cost"><option value="typical">Typical costs</option><option value="conservative">Conservative costs</option></select></label><label>Account size<input value="$10,000" readonly></label></div><p id="costcopy" class="notice"></p></div><div class="actions">${action('Prepare the historical test')}${action('Back','back','secondary')}</div>`; document.querySelector('#risk').value=state.risk;document.querySelector('#cost').value=state.cost; costText();}
  function costText(){const copy=document.querySelector('#costcopy');if(copy)copy.textContent=state.cost==='conservative'?'Conservative: wider spread and slippage than the normal assumption. This is a tougher simulation, not a prediction.':'Typical: normal spread, commission, and slippage are included in every historical trade.'}
  function prepare(){stage.innerHTML=`<h1>Test the rules across history—then check unseen data.</h1><p class="lede">The final two years are held back until the rules are fixed. That helps distinguish an idea from one fitted to old charts.</p><div class="panel"><div class="rule"><div><strong>Development period</strong><span>2016–2023 · used to establish the fixed rules</span></div><span class="pill">8 years</span></div><div class="rule"><div><strong>Unseen period</strong><span>2024–2025 · not used to choose the rule settings</span></div><span class="pill">holdout</span></div><div class="rule"><div><strong>Execution</strong><span>next-bar open, costs included, one position at a time</span></div></div><div class="actions">${action('Run historical simulation')}${action('Back','back','secondary')}</div>`}
  function result(){const conservative=state.cost==='conservative', draw=state.risk===.5?'−9.5%':'−19.0%', ret=conservative?'+5.8%':'+9.4%';stage.innerHTML=`<h1>What would this rule set have felt like?</h1><p class="lede">These are historical ranges under the stated assumptions—not a forecast of a future return.</p><div class="panel"><div class="metrics"><div class="metric"><small>Unseen-period return</small><b class="good">${ret}</b><small>after costs</small></div><div class="metric"><small>Largest drawdown</small><b class="bad">${draw}</b><small>fall from a prior high</small></div><div class="metric"><small>Longest losing streak</small><b>11</b><small>losses in a row</small></div></div><ul class="check"><li>Positive result in the unseen period</li><li>Costs were included before the result was shown</li><li>Nearby average settings remain mixed—not enough stability for a strong verdict</li></ul></div><div class="notice"><strong>Historical simulation only.</strong> This does not predict the next trade and is not investment advice.</div><div class="actions">${action('See the recommended next action')}${action('Change assumptions','back','secondary')}</div>`}
  function decision(){stage.innerHTML=`<h1>Verdict: fragile, not failed.</h1><p class="lede">The unseen-period result is positive, but it varies too much with nearby settings and tougher costs. One favorable parameter is not strong evidence.</p><div class="panel result"><h2>Retest nearby settings and higher costs.</h2><p>Run a named sensitivity test around the 20/50 averages using conservative costs. Keep this result in the record so the next outcome is compared with this one—not treated as a fresh start.</p>${action('Start “MA robustness check”','restart')}</div><h2 style="margin-top:30px">Other honest options</h2><div class="grid"><div class="card"><h3>Reduce risk</h3><p>If a ${state.risk===.5?'9.5':'19'}% historical drawdown would make you abandon the rules, lower position size before testing further.</p></div><div class="card"><h3>Discard or rewrite</h3><p>If the next test is negative in unseen data, revise the hypothesis rather than searching until a number turns green.</p></div></div><p class="footnote">Every experiment raises the disclosed trial count. “Paper trade a fixed version” is only appropriate when the result remains stable under these checks.</p>`}
  function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{if(el.dataset.action==='back')back();else if(el.dataset.action==='restart'){state.step=0;state.path='template';render()}else next()});document.querySelectorAll('[data-path]').forEach(el=>el.onclick=()=>{state.path=el.dataset.path;next()});const custom=document.querySelector('#custom');if(custom)custom.oninput=e=>state.custom=e.target.value;const risk=document.querySelector('#risk');if(risk)risk.onchange=e=>{state.risk=+e.target.value;};const cost=document.querySelector('#cost');if(cost)cost.onchange=e=>{state.cost=e.target.value;costText()};}
  document.querySelector('#restart').onclick=()=>{state.step=0;state.path='template';render()};render();
</script>
</body>
</html>
